name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: autoart_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: autoart_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    env:
      DATABASE_URL: postgresql://autoart_test:test_password@localhost:5432/autoart_test
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-minimum-32-characters-long
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm build:shared

      - name: Build UI package
        run: pnpm --filter @autoart/ui build

      - name: Build backend
        run: pnpm build:backend

      - name: Run database migrations
        run: pnpm migrate

      - name: Seed test data
        run: pnpm seed:dev

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test
        continue-on-error: true # 4 integration tests need DB init in setup — fix separately

      # Playwright setup (uncomment when ready to add E2E tests)
      # - name: Install Playwright browsers
      #   run: pnpm exec playwright install --with-deps chromium
      
      # - name: Build frontend
      #   run: pnpm build:frontend
      
      # - name: Start backend server
      #   run: pnpm start:backend &
      #   env:
      #     PORT: 3001
      
      # - name: Start frontend server
      #   run: pnpm start:frontend &
      #   env:
      #     VITE_API_URL: http://localhost:3001
      
      # - name: Wait for servers to be ready
      #   run: npx wait-on http://localhost:3001/health http://localhost:5173 --timeout 60000
      
